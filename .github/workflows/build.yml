name: Build Swifs APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 1. PHP Backend Lint
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP
        working-directory: backend
        run: find src public routes config -name "*.php" -exec php -l {} \;

      # 2. Flutter Android Build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Scaffold Android Project
        working-directory: app
        run: flutter create . --project-name swifs --platforms=android --org com.swifs

      - name: Inject Native Code
        run: |
          mkdir -p app/android/app/src/main/kotlin/com/swifs/native
          mkdir -p app/android/app/src/main/cpp
          cp android-native/bridge/src/main/kotlin/com/swifs/native/*.kt app/android/app/src/main/kotlin/com/swifs/native/ 2>/dev/null || true
          cp app/native/src/swifs_core.cpp app/android/app/src/main/cpp/ 2>/dev/null || true
          cp app/native/include/swifs_core.h app/android/app/src/main/cpp/ 2>/dev/null || true
          cp app/native/CMakeLists.txt app/android/app/src/main/cpp/CMakeLists.txt 2>/dev/null || true

      # 3. Run Python Optimizer
      - name: Apply Size Optimizations
        working-directory: app
        run: python3 ../scripts/optimize_build.py

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Build arm64-only Release APK
        working-directory: app
        run: |
          flutter build apk --release \
            --target-platform=android-arm64 \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: swifs-arm64-release
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
