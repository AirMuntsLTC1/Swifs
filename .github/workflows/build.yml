name: Build Swifs APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 1. C++ core checks (no backend needed)
      - name: Native core checks
        run: bash tests/native/check.sh

      # 2. Flutter Android Build Setup
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # 3. Preserve custom code before flutter create overwrites it
      - name: Preserve Custom Code
        run: |
          mv app/lib /tmp/swifs_lib
          mv app/pubspec.yaml /tmp/swifs_pubspec.yaml

      - name: Scaffold Android Project
        working-directory: app
        run: flutter create . --project-name swifs --platforms=android --org com.swifs

      - name: Restore Custom Code
        run: |
          rm -rf app/lib
          mv /tmp/swifs_lib app/lib
          cp /tmp/swifs_pubspec.yaml app/pubspec.yaml

      # 4. Inject Native Code (C++ core + Kotlin bridge)
      - name: Inject Native Code
        run: |
          mkdir -p app/android/app/src/main/kotlin/com/swifs/native
          mkdir -p app/android/app/src/main/cpp
          cp android-native/bridge/src/main/kotlin/com/swifs/native/*.kt app/android/app/src/main/kotlin/com/swifs/native/ 2>/dev/null || true
          cp -r app/native/src app/native/include app/android/app/src/main/cpp/
          cp app/native/CMakeLists.txt app/android/app/src/main/cpp/CMakeLists.txt

      # 5. Run Python Optimizer
      - name: Apply Size Optimizations
        working-directory: app
        run: python3 ../scripts/optimize_build.py

      - name: Wire C++ core and internet into Android build
        working-directory: app
        run: python3 ../scripts/wire_native.py

      - name: Inject Supabase Config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: python3 scripts/inject_secrets.py

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      # 6. Quality gate: broken Dart never reaches the APK
      - name: Analyze and test Dart
        working-directory: app
        run: |
          flutter analyze
          flutter test

      - name: Draw Swifs icons in code
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pil
          python3 scripts/make_icons.py

      - name: Generate App Icons
        working-directory: app
        run: dart run flutter_launcher_icons

      - name: Generate Splash Screen
        working-directory: app
        run: dart run flutter_native_splash:create

      - name: Build arm64-only Release APK
        working-directory: app
        run: |
          flutter build apk --release \
            --target-platform=android-arm64 \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: swifs-arm64-release
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
