name: swifs
description: Swifs social media app
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  video_player: ^2.8.6
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  uuid: ^4.4.0
  pull_to_refresh_flutter3: ^2.0.2
  audioplayers: ^6.0.0
  google_fonts: ^6.2.1
  lucide_icons_flutter_plus: ^1.0.1
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  flutter_riverpod: ^2.5.1
  ffi: ^2.1.2
  supabase_flutter: ^2.8.4
  shared_preferences: ^2.3.3
  video_thumbnail: ^0.5.3
  visibility_detector: ^0.4.0
  photo_manager: ^3.6.1
  permission_handler: ^11.3.1
dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1
  pull_to_refresh_flutter3: ^2.0.2
  audioplayers: ^6.0.0
  google_fonts: ^6.2.1
  lucide_icons_flutter_plus: ^1.0.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FF5733"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FF5733"
  image: assets/splash_plane.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#FF5733"
    image: assets/splash_plane.png

dependency_overrides:
  app_links: 6.3.2
